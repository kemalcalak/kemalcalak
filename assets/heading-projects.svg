<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 48" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, 'Liberation Mono', monospace">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="rg" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#13203a" stroke-width="1"/>
    </pattern>
    <radialGradient id="hg" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .t{opacity:0;animation:up 0.6s ease-out 0.2s forwards}
    @keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .dot{animation:pulse 2.6s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:0.4}50%{opacity:1}}
  </style>
  <rect width="900" height="48" fill="#070b14"/>
  <rect width="900" height="48" fill="url(#grid)"/>
  <circle cx="450" cy="24" r="200" fill="url(#hg)"/>
  <rect x="40" y="23" width="284" height="1.6" rx="0.8" fill="url(#lg)"/>
  <rect x="576" y="23" width="284" height="1.6" rx="0.8" fill="url(#rg)"/>
  <circle class="dot" cx="330" cy="24" r="2.4" fill="#22d3ee"/>
  <circle class="dot" style="animation-delay:1.3s" cx="570" cy="24" r="2.4" fill="#22d3ee"/>
  <text class="t" x="450" y="30" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="1" fill="#22d3ee">// featured-projects</text>
</svg>
