<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 440 150" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, 'Liberation Mono', monospace">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#13203a" stroke-width="1"/>
    </pattern>
    <radialGradient id="gg" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .card{opacity:0;animation:up 0.6s cubic-bezier(0.2,0.7,0.3,1) 0.6s forwards}
    @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .card > rect:first-child{animation:pulse 3.4s ease-in-out 1.5s infinite}
    @keyframes pulse{0%,100%{stroke-opacity:0.5}50%{stroke-opacity:1}}
  </style>
  <rect width="440" height="150" fill="#070b14"/>
  <rect width="440" height="150" fill="url(#grid)"/>
  <circle cx="380" cy="130" r="160" fill="url(#gg)"/>
  <g class="card">
    <rect x="8" y="8" width="424" height="134" rx="12" fill="#0b1120" stroke="#1e2b46" stroke-width="1"/>
    <path d="M28 30h8l3 4h13a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H28a2 2 0 0 1-2-2V32a2 2 0 0 1 2-2z" fill="none" stroke="#4ade80" stroke-width="1.4"/>
    <text x="62" y="43" font-size="15" font-weight="700" fill="#4ade80">Fastapi-Template</text>
    <text x="28" y="76" font-size="12" fill="#94a3b8">Production-ready FastAPI template - async SQLAlchemy,</text>
    <text x="28" y="94" font-size="12" fill="#94a3b8">JWT auth, rate limiting, Redis, OpenTelemetry, arq</text>
    <circle cx="32" cy="120" r="4" fill="#3572A5"/>
    <text x="42" y="124" font-size="12" fill="#94a3b8">Python</text>
    <path d="M126 114.5l1.9 3.9 4.3 0.6-3.1 3 0.7 4.2-3.8-2-3.8 2 0.7-4.2-3.1-3 4.3-0.6z" fill="#fbbf24"/>
    <text x="138" y="124" font-size="12" fill="#94a3b8">2</text>
    <text x="412" y="124" text-anchor="end" font-size="11" fill="#475569">view repo -&gt;</text>
