<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 40" width="150" height="40" role="img" aria-label="LinkedIn"><title>LinkedIn</title><style>@font-face{font-family:'Fragment Mono';src:url(data:font/woff2;base64,) format('woff2')}.k{animation:k .01s linear backwards}@keyframes k{from,to{opacity:0}}.in{animation:in .9s cubic-bezier(0.16, 1, 0.3, 1) backwards}@keyframes in{from{opacity:0;transform:translateY(14px)}}.fade{animation:fade .8s ease-out backwards}@keyframes fade{from{opacity:0}}.caret{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}@media (prefers-reduced-motion:reduce){.k,.in,.fade,.draw{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}.caret{animation:none}.loop{display:none}}</style><rect width="150" height="40" fill="#0b0a09"/><rect x=".5" y=".5" width="149" height="39" fill="none" stroke="#292420"/><text x="16" y="25" font-family="'Fragment Mono'" font-size="15" fill="#eae3d6">LinkedIn</text><text x="134" y="25" font-family="'Fragment Mono'" font-size="15" fill="#ff4a1c" text-anchor="end">↗</text></svg>