<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 440 150" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, 'Liberation Mono', monospace">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#13203a" stroke-width="1"/>
    </pattern>
    <radialGradient id="gv" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .card{opacity:0;animation:up 0.6s cubic-bezier(0.2,0.7,0.3,1) 0.3s forwards}
    @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .card > rect:first-child{animation:pulse 3.4s ease-in-out 0.5s infinite}
    @keyframes pulse{0%,100%{stroke-opacity:0.5}50%{stroke-opacity:1}}
  </style>
  <rect width="440" height="150" fill="#070b14"/>
  <rect width="440" height="150" fill="url(#grid)"/>
  <circle cx="380" cy="20" r="160" fill="url(#gv)"/>
  <g class="card">
    <rect x="8" y="8" width="424" height="134" rx="12" fill="#0b1120" stroke="#1e2b46" stroke-width="1"/>
    <path d="M28 30h8l3 4h13a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H28a2 2 0 0 1-2-2V32a2 2 0 0 1 2-2z" fill="none" stroke="#a78bfa" stroke-width="1.4"/>
    <text x="62" y="43" font-size="15" font-weight="700" fill="#a78bfa">DialogTR-Mobile</text>
    <text x="28" y="76" font-size="12" fill="#94a3b8">Cross-platform AI assistant app - React Native / Expo,</text>
    <text x="28" y="94" font-size="12" fill="#94a3b8">on-device Turkish speech-to-text with Whisper</text>
    <circle cx="32" cy="120" r="4" fill="#3178c6"/>
    <text x="42" y="124" font-size="12" fill="#94a3b8">TypeScript</text>
    <text x="412" y="124" text-anchor="end" font-size="11" fill="#475569">view repo -&gt;</text>
  </g>
</svg>
