<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, 'Liberation Mono', monospace">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#13203a" stroke-width="1"/>
    </pattern>
    <radialGradient id="gc" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gv" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .chip{opacity:0;animation:up 0.55s cubic-bezier(0.2,0.7,0.3,1) forwards}
    @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .chip rect{animation:pulse 3.2s ease-in-out infinite}
    @keyframes pulse{0%,100%{stroke-opacity:0.45}50%{stroke-opacity:1}}
    .cat{opacity:0;animation:up 0.55s ease-out forwards}
  </style>

  <!-- backdrop -->
  <rect width="900" height="420" fill="#070b14"/>
  <rect width="900" height="420" fill="url(#grid)"/>
  <circle cx="140" cy="50" r="260" fill="url(#gc)"/>
  <circle cx="770" cy="380" r="290" fill="url(#gv)"/>

  <!-- panel -->
  <rect x="16" y="16" width="868" height="388" rx="12" fill="#0b1120" stroke="#1e2b46" stroke-width="1"/>
  <path d="M16 28a12 12 0 0 1 12-12h844a12 12 0 0 1 12 12v22H16z" fill="#101a2e"/>
  <circle cx="42" cy="33" r="5.5" fill="#ff5f57"/>
  <circle cx="61" cy="33" r="5.5" fill="#febc2e"/>
  <circle cx="80" cy="33" r="5.5" fill="#28c840"/>
  <text x="450" y="38" text-anchor="middle" font-size="12" fill="#64748b">~/tech-stack</text>

  <!-- row 1: languages | frontend & mobile -->
  <text class="cat" style="animation-delay:0.15s" x="45" y="112" font-size="13" font-style="italic" fill="#475569">// languages</text>
  <g class="chip" style="animation-delay:0.25s">
    <rect x="45" y="128" width="78" height="32" rx="8" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee"/>
    <text x="84" y="149" text-anchor="middle" font-size="14" fill="#22d3ee">Python</text>
  </g>
  <g class="chip" style="animation-delay:0.32s">
    <rect x="135" y="128" width="112" height="32" rx="8" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee"/>
    <text x="191" y="149" text-anchor="middle" font-size="14" fill="#22d3ee">TypeScript</text>
  </g>
  <g class="chip" style="animation-delay:0.39s">
    <rect x="259" y="128" width="112" height="32" rx="8" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee"/>
    <text x="315" y="149" text-anchor="middle" font-size="14" fill="#22d3ee">JavaScript</text>
  </g>

  <text class="cat" style="animation-delay:0.2s" x="470" y="112" font-size="13" font-style="italic" fill="#475569">// frontend &amp; mobile</text>
  <g class="chip" style="animation-delay:0.46s">
    <rect x="470" y="128" width="70" height="32" rx="8" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa"/>
    <text x="505" y="149" text-anchor="middle" font-size="14" fill="#a78bfa">React</text>
  </g>
  <g class="chip" style="animation-delay:0.53s">
    <rect x="552" y="128" width="87" height="32" rx="8" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa"/>
    <text x="595" y="149" text-anchor="middle" font-size="14" fill="#a78bfa">Next.js</text>
  </g>
  <g class="chip" style="animation-delay:0.60s">
    <rect x="651" y="128" width="129" height="32" rx="8" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa"/>
    <text x="715" y="149" text-anchor="middle" font-size="14" fill="#a78bfa">React Native</text>
  </g>

  <!-- row 2: backend | database & cache -->
  <text class="cat" style="animation-delay:0.25s" x="45" y="212" font-size="13" font-style="italic" fill="#475569">// backend</text>
  <g class="chip" style="animation-delay:0.67s">
    <rect x="45" y="228" width="87" height="32" rx="8" fill="#4ade80" fill-opacity="0.08" stroke="#4ade80"/>
    <text x="88" y="249" text-anchor="middle" font-size="14" fill="#4ade80">FastAPI</text>
  </g>
  <g class="chip" style="animation-delay:0.74s">
    <rect x="144" y="228" width="87" height="32" rx="8" fill="#4ade80" fill-opacity="0.08" stroke="#4ade80"/>
    <text x="187" y="249" text-anchor="middle" font-size="14" fill="#4ade80">Node.js</text>
  </g>

  <text class="cat" style="animation-delay:0.3s" x="470" y="212" font-size="13" font-style="italic" fill="#475569">// database &amp; cache</text>
  <g class="chip" style="animation-delay:0.81s">
    <rect x="470" y="228" width="112" height="32" rx="8" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24"/>
    <text x="526" y="249" text-anchor="middle" font-size="14" fill="#fbbf24">PostgreSQL</text>
  </g>
  <g class="chip" style="animation-delay:0.88s">
    <rect x="594" y="228" width="87" height="32" rx="8" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24"/>
    <text x="637" y="249" text-anchor="middle" font-size="14" fill="#fbbf24">MongoDB</text>
  </g>
  <g class="chip" style="animation-delay:0.95s">
    <rect x="693" y="228" width="70" height="32" rx="8" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24"/>
    <text x="728" y="249" text-anchor="middle" font-size="14" fill="#fbbf24">Redis</text>
  </g>

  <!-- row 3: ai engineering | tools -->
  <text class="cat" style="animation-delay:0.35s" x="45" y="312" font-size="13" font-style="italic" fill="#475569">// ai engineering</text>
  <g class="chip" style="animation-delay:1.02s">
    <rect x="45" y="328" width="62" height="32" rx="8" fill="#f472b6" fill-opacity="0.08" stroke="#f472b6"/>
    <text x="76" y="349" text-anchor="middle" font-size="14" fill="#f472b6">Agno</text>
  </g>
  <g class="chip" style="animation-delay:1.09s">
    <rect x="119" y="328" width="62" height="32" rx="8" fill="#f472b6" fill-opacity="0.08" stroke="#f472b6"/>
    <text x="150" y="349" text-anchor="middle" font-size="14" fill="#f472b6">YOLO</text>
  </g>
  <g class="chip" style="animation-delay:1.16s">
    <rect x="193" y="328" width="78" height="32" rx="8" fill="#f472b6" fill-opacity="0.08" stroke="#f472b6"/>
    <text x="232" y="349" text-anchor="middle" font-size="14" fill="#f472b6">OpenCV</text>
  </g>

  <text class="cat" style="animation-delay:0.4s" x="470" y="312" font-size="13" font-style="italic" fill="#475569">// tools</text>
  <g class="chip" style="animation-delay:1.23s">
    <rect x="470" y="328" width="53" height="32" rx="8" fill="#94a3b8" fill-opacity="0.08" stroke="#94a3b8"/>
    <text x="496" y="349" text-anchor="middle" font-size="14" fill="#94a3b8">Git</text>
  </g>
  <g class="chip" style="animation-delay:1.30s">
    <rect x="535" y="328" width="78" height="32" rx="8" fill="#94a3b8" fill-opacity="0.08" stroke="#94a3b8"/>
    <text x="574" y="349" text-anchor="middle" font-size="14" fill="#94a3b8">GitHub</text>
  </g>
</svg>
