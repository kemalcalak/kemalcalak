<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 110" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, 'Liberation Mono', monospace">
  <defs>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.75"/>
      <stop offset="0.75" stop-color="#f472b6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#e0f6ff" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="dotGlow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#13203a" stroke-width="1"/>
    </pattern>
    <radialGradient id="gc" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gv" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .pulse{animation:travel 4.5s cubic-bezier(0.4,0,0.2,1) infinite}
    @keyframes travel{0%{transform:translateX(-140px);opacity:0}8%{opacity:1}88%{opacity:1}100%{transform:translateX(920px);opacity:0}}
    .eof{opacity:0;animation:up 0.8s ease-out 0.4s forwards}
    @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .cur{opacity:0;animation:curon 0.01s 1.2s linear forwards,blink 1.1s 1.2s steps(1) infinite}
    @keyframes curon{from{opacity:1}to{opacity:1}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    .pt{animation:fl linear infinite}
    @keyframes fl{0%{transform:translateY(0);opacity:0}15%{opacity:0.5}85%{opacity:0.3}100%{transform:translateY(-95px);opacity:0}}
  </style>

  <rect width="900" height="110" fill="#070b14"/>
  <rect width="900" height="110" fill="url(#grid)"/>
  <circle cx="180" cy="100" r="220" fill="url(#gv)"/>
  <circle cx="730" cy="10" r="230" fill="url(#gc)"/>
  <g>
    <circle class="pt" style="animation-duration:8s;animation-delay:0s"  cx="120" cy="106" r="1.8" fill="#22d3ee" opacity="0.5"/>
    <circle class="pt" style="animation-duration:11s;animation-delay:3s" cx="450" cy="108" r="1.4" fill="#a78bfa" opacity="0.5"/>
    <circle class="pt" style="animation-duration:9s;animation-delay:5s"  cx="780" cy="106" r="1.7" fill="#f472b6" opacity="0.5"/>
  </g>

  <rect x="0" y="34" width="900" height="2" rx="1" fill="url(#lineGrad)"/>
  <g>
    <rect class="pulse" x="0" y="33.2" width="120" height="3.6" rx="1.8" fill="url(#pulseGrad)"/>
  </g>
  <circle cx="450" cy="35" r="3" fill="#a78bfa" filter="url(#dotGlow)"/>

  <text class="eof" x="450" y="80" text-anchor="middle" font-size="14" fill="#64748b">// EOF — thanks for stopping by</text>
  <rect class="cur" x="592" y="68" width="8" height="14" fill="#22d3ee"/>
</svg>
